name: Nightly Integration

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Nightly preflight
        shell: pwsh
        run: |
          pwsh scripts/preflight.ps1 -Mode full -SkipLocGate
      - name: Run Script
        shell: pwsh
        run: |
          pwsh scripts/selftest_local.ps1
          pwsh scripts/perf_baseline.ps1
          pwsh scripts/perf_report.ps1
      - name: Report
        run: |
          echo "Checked PERFORMANCE_REPORT.md"
