name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-guards:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "chardet<5.3"

      - name: Ruff
        run: python -m ruff check .

      - name: Check LOC increase
        shell: pwsh
        run: |
          pwsh scripts/loc_report.ps1
          # Requires workspace\LOC_BASELINE.json

  core-tests:
    runs-on: windows-latest
    needs: lint-and-guards
    name: core-tests / shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "chardet<5.3"
          
      - name: Core Tests (Shard ${{ matrix.shard }})
        timeout-minutes: 20
        env:
          PYTEST_ADDOPTS: ""
        run: python scripts/run_ci_suite.py --suite core --total-shards 4 --shard-index ${{ matrix.shard }} --timeout-seconds 1140

  memory-recall:
    runs-on: windows-latest
    needs: lint-and-guards
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "chardet<5.3"

      - name: Memory Recall Tests
        env:
          PYTEST_ADDOPTS: ""
        run: python scripts/run_ci_suite.py --suite memory-recall

  core-runtime-sensitive:
    runs-on: windows-latest
    needs: lint-and-guards
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "chardet<5.3"

      - name: Core Runtime-Sensitive Tests
        env:
          PYTEST_ADDOPTS: ""
        run: python scripts/run_ci_suite.py --suite core-runtime-sensitive

  channel-matrix:
    runs-on: windows-latest
    needs: lint-and-guards
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: channel-webchat-webhook
          - name: channel-slack
          - name: channel-signal
          - name: channel-matrix
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "chardet<5.3"

      - name: Channel Tests (${{ matrix.suite.name }})
        env:
          PYTEST_ADDOPTS: ""
        run: python scripts/run_ci_suite.py --suite ${{ matrix.suite.name }}

  summary:
    runs-on: windows-latest
    needs:
      - lint-and-guards
      - core-tests
      - core-runtime-sensitive
      - memory-recall
      - channel-matrix
    steps:
      - name: CI summary
        run: |
          echo "lint-and-guards, core-tests, core-runtime-sensitive, memory-recall, and channel-matrix completed successfully."
