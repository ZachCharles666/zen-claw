name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-guards:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "chardet<5.3"

      - name: Ruff
        run: python -m ruff check .

      - name: Check LOC increase
        shell: pwsh
        run: |
          pwsh scripts/loc_report.ps1
          # Requires workspace\LOC_BASELINE.json

  core-tests:
    runs-on: windows-latest
    needs: lint-and-guards
    name: core-tests / shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "chardet<5.3"
          
      - name: Core Tests (Shard ${{ matrix.shard }})
        timeout-minutes: 20
        env:
          PYTEST_ADDOPTS: ""
        shell: pwsh
        run: |
          $selection = python scripts/ci_select_tests.py --suite core --total-shards 4 --shard-index ${{ matrix.shard }} --format json | ConvertFrom-Json
          $baseTemp = Join-Path $PWD ".pytest_tmp/core-shard-${{ matrix.shard }}"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $baseTemp) | Out-Null
          Write-Host "Running core shard ${{ matrix.shard }}: $($selection.tests -join ' ')"
          python -m pytest -p no:timeout --basetemp $baseTemp -q @($selection.tests)

  memory-recall:
    runs-on: windows-latest
    needs: lint-and-guards
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "chardet<5.3"

      - name: Memory Recall Tests
        shell: pwsh
        env:
          PYTEST_ADDOPTS: ""
        run: |
          $selection = python scripts/ci_select_tests.py --suite memory-recall --format json | ConvertFrom-Json
          $baseTemp = Join-Path $PWD ".pytest_tmp/memory-recall"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $baseTemp) | Out-Null
          python -m pytest -p no:timeout --basetemp $baseTemp -q @($selection.tests)

  channel-matrix:
    runs-on: windows-latest
    needs: lint-and-guards
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: channel-webchat-webhook
          - name: channel-slack
          - name: channel-signal
          - name: channel-matrix
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "chardet<5.3"

      - name: Channel Tests (${{ matrix.suite.name }})
        shell: pwsh
        env:
          PYTEST_ADDOPTS: ""
        run: |
          $selection = python scripts/ci_select_tests.py --suite ${{ matrix.suite.name }} --format json | ConvertFrom-Json
          $baseTemp = Join-Path $PWD ".pytest_tmp/${{ matrix.suite.name }}"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $baseTemp) | Out-Null
          python -m pytest -p no:timeout --basetemp $baseTemp -q @($selection.tests)

  summary:
    runs-on: windows-latest
    needs:
      - lint-and-guards
      - core-tests
      - memory-recall
      - channel-matrix
    steps:
      - name: CI summary
        run: |
          echo "lint-and-guards, core-tests, memory-recall, and channel-matrix completed successfully."
